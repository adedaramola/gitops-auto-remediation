name: Notify Action Dispatched

on:
  push:
    branches: [ "main" ]
    paths:
      - "gitops/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Extract incident id and service from last commit message
        id: extract
        run: |
          MSG="$(git log -1 --pretty=%B)"
          echo "Commit message: $MSG"
          # Auto-applied merges already emitted ActionDispatched from the
          # Decision Engine; emitting again would run the Outcome Validator twice.
          if echo "$MSG" | grep -q "auto-applied by decision engine"; then
            echo "Auto-applied merge detected — skipping duplicate ActionDispatched."
            echo "incident_id=" >> $GITHUB_OUTPUT
            echo "service=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi
          INC=$(echo "$MSG" | grep -oE "inc-[0-9]+-[a-z0-9]+" | head -n 1 || true)
          SVC=$(echo "$MSG" | grep -oP '(?<=for )\S+(?= \()' | head -n 1 || true)
          echo "incident_id=$INC" >> $GITHUB_OUTPUT
          echo "service=${SVC:-unknown}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: steps.extract.outputs.incident_id != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Put EventBridge event ActionDispatched
        if: steps.extract.outputs.incident_id != ''
        env:
          INCIDENT_ID: ${{ steps.extract.outputs.incident_id }}
          SERVICE: ${{ steps.extract.outputs.service }}
          EVENT_BUS_NAME: ${{ secrets.AWS_EVENT_BUS_NAME }}
        run: |
          cat > /tmp/eb-entry.json <<JSON
          [
            {
              "EventBusName": "${EVENT_BUS_NAME}",
              "Source": "gitops.sentinel",
              "DetailType": "ActionDispatched",
              "Detail": "{\"incident_id\":\"${INCIDENT_ID}\",\"service\":\"${SERVICE}\"}"
            }
          ]
          JSON
          aws events put-events --entries file:///tmp/eb-entry.json
