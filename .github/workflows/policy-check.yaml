name: Policy Check (Allowed Actions)

# Runs on every PR (no path filter): policy-check is a required status check
# on main; PRs that touch no gitops files pass with 0 manifests checked.
on:
  pull_request:

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: List gitops files changed in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'gitops/**' > /tmp/changed-files.txt
          echo "Changed gitops files:"
          cat /tmp/changed-files.txt

      - name: Enforce policy bounds on changed files
        run: |
          python - <<'PY'
          import yaml, pathlib, sys

          def get_constraint(allowed, action, key, default=None):
              for a in allowed.get("allowed_actions", []):
                  if a.get("action") == action:
                      return a.get("constraints", {}).get(key, default)
              return default

          changed = {
              pathlib.Path(line.strip())
              for line in pathlib.Path("/tmp/changed-files.txt").read_text().splitlines()
              if line.strip()
          }
          # Only manifests touched by this PR are validated; pre-existing state
          # is not this PR's fault and must not block unrelated remediations.
          changed_apps = [p for p in sorted(changed) if p.parts[:2] == ("gitops", "apps") and p.exists()]

          allowed = yaml.safe_load(pathlib.Path("gitops/policies/allowed-actions.yaml").read_text())
          violations = []

          # ── scale_replicas: enforce min/max on changed kustomizations ──
          min_rep = get_constraint(allowed, "scale_replicas", "min", 1)
          max_rep = get_constraint(allowed, "scale_replicas", "max")

          for kfile in changed_apps:
              if kfile.name != "kustomization.yaml":
                  continue
              doc = yaml.safe_load(kfile.read_text()) or {}
              for patch_entry in doc.get("patches", []):
                  patch_str = patch_entry.get("patch", "")
                  if not patch_str:
                      continue
                  ops = yaml.safe_load(patch_str) or []
                  if not isinstance(ops, list):
                      continue
                  for op in ops:
                      if op.get("path") == "/spec/replicas":
                          replicas = op.get("value")
                          if replicas is None:
                              continue
                          if max_rep is not None and int(replicas) > int(max_rep):
                              violations.append(f"{kfile}: replicas {replicas} exceeds max {max_rep}")
                          if int(replicas) < int(min_rep):
                              violations.append(f"{kfile}: replicas {replicas} below min {min_rep}")

          # ── rollback_image: enforce allowed image tags in changed deployments ──
          allowed_tags = get_constraint(allowed, "rollback_image", "allowed_tags", [])

          if allowed_tags:
              for dfile in changed_apps:
                  if dfile.name != "deployment.yaml":
                      continue
                  doc = yaml.safe_load(dfile.read_text()) or {}
                  try:
                      containers = doc["spec"]["template"]["spec"]["containers"]
                  except (KeyError, TypeError):
                      continue
                  for c in containers:
                      image = c.get("image", "")
                      if ":" in image:
                          tag = image.rsplit(":", 1)[1]
                          if tag not in allowed_tags:
                              violations.append(f"{dfile}: image tag '{tag}' not in allowed_tags {allowed_tags}")

          if violations:
              print("Policy violations found:")
              for v in violations:
                  print(f"  x {v}")
              sys.exit(1)

          print(f"Policy OK — {len(changed_apps)} changed manifest(s) checked")
          PY
