name: Validate GitOps PR

# Runs on every PR (no path filter): these jobs are required status checks on
# main, and a required check that never reports blocks the PR forever.
on:
  pull_request:

jobs:
  validate-gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.4.3
        run: |
          curl -fsSLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Build staging manifests
        run: kustomize build gitops/clusters/staging > /tmp/staging.yaml

      - name: Build prod manifests
        run: kustomize build gitops/clusters/prod > /tmp/prod.yaml

      - name: Basic YAML sanity check
        run: |
          python - <<'PY'
          import sys, yaml
          for p in ["/tmp/staging.yaml", "/tmp/prod.yaml"]:
            with open(p, "r") as f:
              list(yaml.safe_load_all(f))
          print("OK")
          PY

  check-lambda-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fail if Lambda sources are out of sync with Terraform modules
        run: |
          for fn in signal_collector decision_engine outcome_validator classifier_agent root_cause_agent action_planner confidence_scorer; do
            diff lambdas/$fn/app.py terraform/modules/lambda_$fn/src/app.py || \
              (echo "ERROR: $fn source drifted — run 'make sync-lambda' and commit." && exit 1)
          done

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.53.0
      - name: Init tflint
        run: tflint --init
        working-directory: terraform
      - name: Run tflint
        run: tflint --recursive
        working-directory: terraform

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (medium+ severity)
        run: bandit -r lambdas/ -ll --exclude lambdas/tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambdas/requirements.txt
          pip install -r lambdas/requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          cd lambdas && python -m pytest tests/ -v \
            --cov=signal_collector.app --cov=decision_engine.app --cov=outcome_validator.app \
            --cov=classifier_agent.app --cov=root_cause_agent.app \
            --cov=action_planner.app   --cov=confidence_scorer.app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --tb=short
